<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>RECRED — Inicio</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="recred.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" referrerpolicy="no-referrer">
  <script>
    (function () {
      try {
        var mode = localStorage.getItem('theme_mode') || localStorage.getItem('theme');
        var theme = 'light';
        if (mode === 'dark') {
          theme = 'dark';
        } else if (mode === 'light') {
          theme = 'light';
        } else if (mode === 'auto') {
          var h = new Date().getHours();
          theme = (h >= 19 || h < 7) ? 'dark' : 'light';
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          theme = 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
